<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex & David's Wedding</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Botanical Color Palette & Base Styles --- */
        :root {
            --primary-color: #314438; /* Deep Eucalyptus Green */
            --accent-color: #8fa393; /* Soft Rosemary/Sage Green */
            --bg-color: #fdfdfc; /* Warm off-white */
            --section-bg: #eef1ef; /* Very pale sage for contrast sections */
            --text-color: #3e443f; /* Soft dark grey-green for readable text */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-color);
            text-align: center;
        }

        a {
            text-decoration: none;
            color: var(--primary-color);
            transition: color 0.3s ease;
        }

        a:hover {
            color: var(--accent-color);
        }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(253, 253, 252, 0.95);
            padding: 1rem 0;
            box-shadow: 0 2px 15px rgba(49, 68, 56, 0.08);
            z-index: 1000;
        }

        nav ul {
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            color: var(--primary-color);
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 2rem;
            /* Updated Botanical background image with a soft green/grey overlay */
            background-image: linear-gradient(rgba(49, 68, 56, 0.75), rgba(49, 68, 56, 0.6)), url('');
            background-size: cover;
            background-position: center;
        }

        .hero h1 {
            color: white;
            font-size: 4.5rem;
            margin-bottom: 0.5rem;
            font-style: italic;
            font-weight: 400;
        }

        .hero p {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            color: #d6ded7; /* Very pale green text */
        }

        /* --- Content Sections --- */
        section {
            padding: 6rem 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            position: relative;
            padding-bottom: 1rem;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background-color: var(--accent-color);
        }

        .text-center {
            text-align: center;
        }

        /* --- Details Grid --- */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.5rem;
            margin-top: 3rem;
        }

        .detail-card {
            background: var(--bg-color);
            padding: 2.5rem 2rem;
            text-align: center;
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            position: relative;
        }

        /* Adding a subtle inner border for a stationery feel */
        .detail-card::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(143, 163, 147, 0.3);
            pointer-events: none;
        }

        .detail-card h3 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        /* --- RSVP Button --- */
        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 3rem;
            border: 1px solid var(--primary-color);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 2rem;
            cursor: pointer;
            transition: all 0.4s ease;
            border-radius: 2px;
        }

        .btn:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        /* --- Footer --- */
        footer {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 3rem 2rem;
        }

        footer h2 {
            color: white;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 3rem; }
            nav ul { gap: 1rem; }
            nav a { font-size: 0.75rem; }
            section { padding: 4rem 1.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#our-story">Our Story</a></li>
            <li><a href="#details">Details</a></li>
            <li><a href="#rsvp">RSVP</a></li>
        </ul>
    </nav>

    <section id="home" class="hero
